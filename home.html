<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Malnutrition Tracking & Prevention System - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #006B54;
            --secondary-color: #4CAF50;
            --background-color: #f5f5f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
        }

        .navbar {
            background-color: var(--primary-color);
            padding: 1rem;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .dashboard-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            color: white;
            margin-bottom: 20px;
        }

        .stat-card.primary {
            background: var(--primary-color);
        }

        .stat-card.secondary {
            background: var(--secondary-color);
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .action-button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: var(--primary-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-button:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }

        .profile-section {
            text-align: center;
            padding: 20px;
        }

        .profile-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .chart-container {
            height: 300px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Child Malnutrition Tracking & Prevention System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#"><i class="fas fa-user"></i> Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Main Dashboard Content -->
            <div class="col-md-8">
                <div class="dashboard-card">
                    <div class="card-header">
                        <h4>Child Health Overview</h4>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="stat-card primary">
                                <h3>Growth Status</h3>
                                <p>Normal</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="stat-card secondary">
                                <h3>Next Checkup</h3>
                                <p>In 7 days</p>
                            </div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <!-- Growth Chart will be inserted here -->
                        <canvas id="growthChart"></canvas>
                    </div>
                </div>

                <div class="dashboard-card">
                    <div class="card-header">
                        <h4>Quick Actions</h4>
                    </div>
                    <div class="quick-actions">
                        <button class="action-button" onclick="window.location.href='monitor.html'">
                            Monitor Child
                        </button>
                        <button class="action-button" onclick="window.location.href='medication.html'">
                            View Medications
                        </button>
                        <button class="action-button" onclick="window.location.href='reports.html'">
                            Generate Report
                        </button>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="col-md-4">
                <div class="dashboard-card">
                    <div class="profile-section">
                        <img src="https://via.placeholder.com/100" alt="Profile" class="profile-image">
                        <h4>Welcome, User</h4>
                        <p>Role: Caretaker</p>
                    </div>
                </div>

                <div class="dashboard-card">
                    <div class="card-header">
                        <h4>Recent Updates</h4>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">Last checkup: 2 weeks ago</li>
                        <li class="list-group-item">Weight: 20 kg</li>
                        <li class="list-group-item">Height: 110 cm</li>
                        <li class="list-group-item">BMI: 16.5</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Sample Growth Chart
        const ctx = document.getElementById('growthChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Weight (kg)',
                    data: [19, 19.2, 19.5, 19.8, 20, 20.2],
                    borderColor: '#006B54',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: false
                    }
                }
            }
        });
    </script>
</body>
</html>
